[project]
name = "healthcore-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn>=0.52.1,<1.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "tinydb>=4.8.0,<5.0.0",
    "pydantic[email]>=2.0.0,<3.0.0",
]

[project.scripts]
seed = "services.api.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]
